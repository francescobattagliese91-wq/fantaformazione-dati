name: Esplora BSD
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/esplora.mjs
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      - run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples
          git diff --cached --quiet || git commit -m "Esempi BSD"
          git push
