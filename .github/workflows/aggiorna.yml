name: Aggiorna dati

on:
  schedule:
    - cron: '23 5 * * *'      # ogni mattina (ora UTC): aggiornamento completo
    - cron: '41 10-21 * * *'  # ogni ora: formazioni ufficiali delle partite in arrivo
  workflow_dispatch:           # avvio a mano dal tab Actions

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica e calcola
        run: node scripts/aggiorna.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Pubblica
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet || git commit -m "Dati aggiornati"
          git push
